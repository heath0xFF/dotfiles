# ── Reload ────────────────────────────────────────────────────
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ── Terminal / colors ─────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# forward cursor-shape changes (DECSCUSR) from inner apps like nvim;
# Se resets to the terminal *default* (\E[ q) so ghostty's bar comes back
set -ag terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[ q'
set -g default-shell "/bin/zsh"
set -g extended-keys on

# ── Prefix: Ctrl+Space ────────────────────────────────────────
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# ── Status bar ────────────────────────────────────────────────
set -g status-bg "#333333"
set -g status-fg white
set -g status-position top
set -g status-interval 1
set -g status-left ""

# ── Indexing / mouse ──────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on

# ── Activity ──────────────────────────────────────────────────
setw -g monitor-activity on
set -g visual-activity on

# ── Pane navigation (arrows + i/j/k/l cluster) ────────────────
bind -n M-Left  select-pane -L
bind -n M-h     select-pane -L
bind -n M-Right select-pane -R
bind -n M-l     select-pane -R
bind -n M-Up    select-pane -U
bind -n M-k     select-pane -U
bind -n M-Down  select-pane -D
bind -n M-j     select-pane -D

# ── Splits (always open at ~) ─────────────────────────────────
bind \\ split-window -h -c '~'
bind -  split-window -v -c '~'
bind c  new-window   -c '~'
bind '"' split-window -v -c '~'
bind %  split-window -h -c '~'

# ── Window navigation (current session, not hardcoded) ────────
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
